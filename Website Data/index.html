<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verifying You&rsquo;re Human&hellip;</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: rgba(255,255,255,0.07);
      --accent: #7c6aff;
      --accent-glow: rgba(124,106,255,0.25);
      --accent-soft: rgba(124,106,255,0.12);
      --text: #e8e8f0;
      --muted: #6b6b80;
      --success: #4ade80;
      --success-glow: rgba(74,222,128,0.2);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
    }

    /* ── Noise overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* ── Ambient blobs ── */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      width: 500px; height: 500px;
      background: var(--accent-glow);
      top: -100px; left: -100px;
      animation: drift1 12s ease-in-out infinite alternate;
    }
    .blob-2 {
      width: 350px; height: 350px;
      background: rgba(100,200,255,0.08);
      bottom: -80px; right: -80px;
      animation: drift2 15s ease-in-out infinite alternate;
    }
    @keyframes drift1 { to { transform: translate(60px, 80px); } }
    @keyframes drift2 { to { transform: translate(-40px, -60px); } }

    /* ── Gate overlay ── */
    #gate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #gate.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 40px 80px rgba(0,0,0,0.6),
        0 0 60px var(--accent-glow);
      animation: slideUp 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

    /* top accent line */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 50%;
    }

    /* shield icon */
    .icon-wrap {
      width: 64px; height: 64px;
      margin: 0 auto 1.5rem;
      background: var(--accent-soft);
      border: 1px solid rgba(124,106,255,0.3);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem;
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
      50%       { box-shadow: 0 0 0 12px transparent; }
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.03em;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    /* Turnstile widget centering */
    .cf-turnstile {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    /* Status messages */
    #status {
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      min-height: 1.2em;
      transition: color 0.3s;
    }
    #status.error  { color: #f87171; }
    #status.ok     { color: var(--success); }
    #status.info   { color: var(--muted); }

    /* loading dots */
    .dots::after {
      content: '';
      animation: dots 1.2s steps(3, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }

    /* ── Main content (hidden by default) ── */
    #main-content {
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease 0.3s, transform 0.8s ease 0.3s;
      pointer-events: none;
    }
    #main-content.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* ── Placeholder main page ── */
    .main-inner {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
    }
    .main-inner h2 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .main-inner p {
      color: var(--muted);
      font-size: 0.9rem;
      max-width: 400px;
      line-height: 1.7;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--success-glow);
      border: 1px solid rgba(74,222,128,0.3);
      color: var(--success);
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

  <!-- Ambient -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- ── VERIFICATION GATE ── -->
  <div id="gate">
    <div class="card">
      <div class="icon-wrap">🛡️</div>
      <h1>One quick check</h1>
      <p class="subtitle">Verifying you&rsquo;re human before we let you in.<br/>This takes just a moment.</p>

      <!-- Turnstile widget — replace data-sitekey if needed -->
      <div class="cf-turnstile"
           data-sitekey="0x4AAAAAADK62E4JlCqC68cb"
           data-callback="onTurnstileSuccess"
           data-error-callback="onTurnstileError"
           data-theme="dark">
      </div>

      <div id="status" class="info"></div>
    </div>
  </div>

  <!-- ── YOUR MAIN SITE CONTENT ── -->
  <div id="main-content">
    <div class="main-inner">
      <span class="badge">✓ &nbsp;VERIFIED</span>
      <h2>Welcome aboard.</h2>
      <p>You&rsquo;ve passed the check. Replace this section with your actual website content.</p>
    </div>
  </div>

  <script>
    const gate    = document.getElementById('gate');
    const content = document.getElementById('main-content');
    const status  = document.getElementById('status');

    function setStatus(msg, type = 'info') {
      status.textContent = msg;
      status.className = type;
    }

    async function onTurnstileSuccess(token) {
      setStatus('Verifying', 'info');
      status.classList.add('dots');

      try {
        const res = await fetch('/functions/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });

        const data = await res.json();

        if (data.success) {
          setStatus('✓ Verified!', 'ok');
          setTimeout(revealContent, 600);
        } else {
          setStatus('Verification failed. Please refresh.', 'error');
          turnstile.reset();
        }
      } catch (err) {
        setStatus('Network error. Please try again.', 'error');
        turnstile.reset();
      }
    }

    function onTurnstileError() {
      setStatus('Challenge failed. Please refresh.', 'error');
    }

    function revealContent() {
      gate.classList.add('hidden');
      content.classList.add('visible');
      document.body.style.overflow = '';
    }
  </script>
</body>
</html>
